name: Build and Release Fortress

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Fortress + Freighter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x fortress/gradlew
          chmod +x freighter/gradlew

      - name: Build Freighter
        working-directory: freighter
        run: |
          ./gradlew assembleRelease

      - name: Find Freighter APK
        id: freighter
        working-directory: freighter
        run: |
          APK=$(find . \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Freighter APK not found"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          APK="${APK#./}"
          echo "Found Freighter: $APK"
          echo "apk=freighter/$APK" >> "$GITHUB_OUTPUT"

      - name: Bundle Freighter into Fortress
        run: |
          mkdir -p fortress/app/src/release/assets

          cp "${{ steps.freighter.outputs.apk }}" \
             fortress/app/src/release/assets/freighter.apk

          echo "Freighter bundled successfully:"
          ls -lh fortress/app/src/release/assets/freighter.apk

      - name: Build Fortress
        working-directory: fortress
        run: |
          ./gradlew assembleRelease

      - name: Find Fortress APK
        id: fortress
        working-directory: fortress
        run: |
          APK=$(find . \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Fortress APK not found"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          APK="${APK#./}"
          echo "Found Fortress: $APK"
          echo "apk=fortress/$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          rm -rf dist
          mkdir -p dist

          cp "${{ steps.fortress.outputs.apk }}" \
             dist/Fortress.apk

          cp "${{ steps.freighter.outputs.apk }}" \
             dist/Freighter.apk

          cd dist

          sha256sum Fortress.apk Freighter.apk > SHA256SUMS.txt

          echo "================================"
          echo "RELEASE FILES"
          echo "================================"
          ls -lh

          echo
          echo "================================"
          echo "SHA256"
          echo "================================"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists."
            echo "Use a different version number."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --prerelease \
              --generate-notes
          else
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --generate-notes
          fi