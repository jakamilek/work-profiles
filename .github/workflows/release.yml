name: Build and Release Fortress

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Fortress + Freighter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Make Gradle wrappers executable
        run: |
          chmod +x fortress/gradlew
          chmod +x freighter/gradlew

      # ---------------------------------------------------------
      # Build Freighter first.
      # Fortress bundles Freighter inside its release APK.
      # ---------------------------------------------------------

      - name: Build Freighter
        working-directory: freighter
        run: |
          ./gradlew assembleRelease

      - name: Find Freighter APK
        id: freighter
        run: |
          APK=$(find freighter \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Freighter APK not found"
            find freighter -type f -name '*.apk' -print
            exit 1
          fi

          echo "Found Freighter: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Bundle Freighter into Fortress.
      # ---------------------------------------------------------

      - name: Bundle Freighter into Fortress
        run: |
          mkdir -p fortress/app/src/release/assets

          cp "${{ steps.freighter.outputs.apk }}" \
             fortress/app/src/release/assets/freighter.apk

          echo "Bundled Freighter:"
          ls -lh fortress/app/src/release/assets/freighter.apk

      # ---------------------------------------------------------
      # Build Fortress.
      # ---------------------------------------------------------

      - name: Build Fortress
        working-directory: fortress
        run: |
          ./gradlew assembleRelease

      - name: Find Fortress APK
        id: fortress
        run: |
          APK=$(find fortress \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Fortress APK not found"
            find fortress -type f -name '*.apk' -print
            exit 1
          fi

          echo "Found Fortress: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Prepare release files.
      # ---------------------------------------------------------

      - name: Prepare release
        run: |
          rm -rf dist
          mkdir -p dist

          cp "${{ steps.fortress.outputs.apk }}" \
             dist/Fortress.apk

          cp "${{ steps.freighter.outputs.apk }}" \
             dist/Freighter.apk

          cd dist

          sha256sum Fortress.apk Freighter.apk > SHA256SUMS.txt

          echo "=== RELEASE FILES ==="
          ls -lh

          echo
          echo "=== SHA256 ==="
          cat SHA256SUMS.txt

      # ---------------------------------------------------------
      # Create GitHub Release.
      # ---------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --prerelease \
              --generate-notes
          else
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --generate-notes
          fi