name: Build and Release Fortress

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.1"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build Fortress + Freighter
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x fortress/gradlew
          chmod +x freighter/gradlew

      # ---------------------------------------------------------
      # Create a temporary signing key.
      #
      # This is NOT the author's official release key.
      # It is generated only for this GitHub Actions build.
      # ---------------------------------------------------------

      - name: Create temporary signing key
        run: |
          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/fortress-ci.jks \
            -alias fortress \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Fortress CI, OU=Local Build, O=Fortress, L=Local, ST=Local, C=PL"

      # ---------------------------------------------------------
      # Build Freighter.
      # ---------------------------------------------------------

      - name: Build Freighter
        working-directory: freighter
        run: |
          ./gradlew assembleRelease

      - name: Find Freighter APK
        id: freighter
        working-directory: freighter
        run: |
          APK=$(find . \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Freighter APK not found"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          echo "Found Freighter:"
          echo "$APK"

          APK="${APK#./}"

          echo "apk=freighter/$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Sign Freighter.
      # ---------------------------------------------------------

      - name: Sign Freighter
        run: |
          mkdir -p signed

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/zipalign \
            -f 4 \
            "${{ steps.freighter.outputs.apk }}" \
            signed/Freighter-aligned.apk

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner sign \
            --ks signing/fortress-ci.jks \
            --ks-key-alias fortress \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out signed/Freighter.apk \
            signed/Freighter-aligned.apk

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify \
            --verbose \
            signed/Freighter.apk

      # ---------------------------------------------------------
      # Bundle signed Freighter into Fortress.
      # ---------------------------------------------------------

      - name: Bundle Freighter into Fortress
        run: |
          mkdir -p fortress/app/src/release/assets

          cp signed/Freighter.apk \
             fortress/app/src/release/assets/freighter.apk

          echo "Bundled Freighter:"
          ls -lh fortress/app/src/release/assets/freighter.apk

      # ---------------------------------------------------------
      # Build Fortress.
      # ---------------------------------------------------------

      - name: Build Fortress
        working-directory: fortress
        run: |
          ./gradlew assembleRelease

      - name: Find Fortress APK
        id: fortress
        working-directory: fortress
        run: |
          APK=$(find . \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Fortress APK not found"
            find . -type f -name '*.apk' -print
            exit 1
          fi

          echo "Found Fortress:"
          echo "$APK"

          APK="${APK#./}"

          echo "apk=fortress/$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Sign Fortress with EXACTLY the same key.
      # ---------------------------------------------------------

      - name: Sign Fortress
        run: |
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/zipalign \
            -f 4 \
            "${{ steps.fortress.outputs.apk }}" \
            signed/Fortress-aligned.apk

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner sign \
            --ks signing/fortress-ci.jks \
            --ks-key-alias fortress \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out signed/Fortress.apk \
            signed/Fortress-aligned.apk

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify \
            --verbose \
            signed/Fortress.apk

      # ---------------------------------------------------------
      # Verify that Fortress and Freighter use the same certificate.
      # ---------------------------------------------------------

      - name: Verify signing certificates
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"

          echo "=== Fortress certificate ==="
          "$BUILD_TOOLS/apksigner" verify --print-certs signed/Fortress.apk

          echo
          echo "=== Freighter certificate ==="
          "$BUILD_TOOLS/apksigner" verify --print-certs signed/Freighter.apk

      # ---------------------------------------------------------
      # Prepare release.
      # ---------------------------------------------------------

      - name: Prepare release files
        run: |
          rm -rf dist
          mkdir -p dist

          cp signed/Fortress.apk \
             dist/Fortress.apk

          cp signed/Freighter.apk \
             dist/Freighter.apk

          cd dist

          sha256sum Fortress.apk Freighter.apk > SHA256SUMS.txt

          echo "================================"
          echo "RELEASE FILES"
          echo "================================"

          ls -lh

          echo
          echo "================================"
          echo "SHA256"
          echo "================================"

          cat SHA256SUMS.txt

      # ---------------------------------------------------------
      # Create GitHub Release.
      # ---------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists."
            echo "Use a different version number."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --prerelease \
              --generate-notes
          else
            gh release create "$TAG" \
              dist/Fortress.apk \
              dist/Freighter.apk \
              dist/SHA256SUMS.txt \
              --title "Fortress ${VERSION}" \
              --generate-notes
          fi